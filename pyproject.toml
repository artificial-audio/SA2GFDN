[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sa2gfdn"
version = "0.1.0"
description = "Reproducible statistical-acoustics coupled-room GFDN experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyFDN==0.7.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
notebooks = ["marimo", "multislope>=0.1.1", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sa2gfdn*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:numpy.ndarray size changed:RuntimeWarning"]

[tool.marimo.runtime]
pythonpath = ["src"]

[tool.setuptools.package-data]
sa2gfdn = ["paper_mixers.json"]
